name: 'IaC Continuous Integration (PR)'

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/*
      - feature/*
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: iac-ci-pr-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: 'Detect Changed Modules and Environments'
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      has_modules: ${{ steps.detect.outputs.has_modules }}
      environments: ${{ steps.detect.outputs.environments }}
      has_environments: ${{ steps.detect.outputs.has_environments }}
      all_triggered: ${{ steps.detect.outputs.all_triggered }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect Changed Targets
        id: detect
        shell: bash
        run: |
          BASE_REF="origin/${{ github.base_ref || 'main' }}"
          echo "[INFO] Comparing changes against base ref: $BASE_REF"
          python .github/scripts/detect_changed_targets.py --base-ref "$BASE_REF" || python .github/scripts/detect_changed_targets.py --force-all

  validate-modules:
    name: 'Validate Module (${{ matrix.module }})'
    needs: detect-changes
    if: needs.detect-changes.outputs.has_modules == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: 'v0.55.0'

      - name: Initialize TFLint plugins
        shell: bash
        run: |
          if [ -f ".tflint.hcl" ]; then
            tflint --init --config=".tflint.hcl"
          else
            tflint --init
          fi

      - name: Setup Trivy vulnerability scanner
        uses: aquasecurity/setup-trivy@v0.2.2
        with:
          version: 'v0.58.2'
          cache: true

      - name: Check Terraform formatting for module
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          echo "[INFO] Checking terraform fmt in ${{ matrix.module }}..."
          terraform fmt -check -recursive .

      - name: Validate module syntax
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          echo "[INFO] Validating module syntax in ${{ matrix.module }}..."
          terraform init -backend=false
          terraform validate

      - name: Run TFLint on module
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          echo "[INFO] Running TFLint on ${{ matrix.module }}..."
          CONFIG_PATH="../../.tflint.hcl"
          if [ -f "$CONFIG_PATH" ]; then
            tflint --recursive --config="$CONFIG_PATH"
          else
            tflint --recursive
          fi

      - name: Run Trivy security scan on module
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          echo "[INFO] Scanning module ${{ matrix.module }} with Trivy..."
          trivy config --severity HIGH,CRITICAL --exit-code 1 --scanners misconfig .

      - name: Validate sample execution fixture (PC-IAC-026)
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          if [ -d "sample" ]; then
            echo "[INFO] Validating sample fixture in ${{ matrix.module }}/sample per PC-IAC-026..."
            cd sample
            terraform fmt -check -recursive .
            terraform init -backend=false
            terraform validate
          else
            echo "[INFO] No sample directory present in ${{ matrix.module }}."
          fi

  validate-environments:
    name: 'Validate Environment (${{ matrix.environment }})'
    needs: detect-changes
    if: needs.detect-changes.outputs.has_environments == 'true' || needs.detect-changes.outputs.all_triggered == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, test, prod]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false

      - name: Validate environment syntax
        shell: bash
        run: |
          TARGET="environments/${{ matrix.environment }}"
          if [ -d "$TARGET" ]; then
            echo "[INFO] Validating syntax in $TARGET..."
            cd "$TARGET"
            terraform fmt -check -recursive .
            terraform init -backend=false
            terraform validate
          fi

  infracost-finops:
    name: 'FinOps Cloud Cost Estimation'
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && (needs.detect-changes.outputs.has_modules == 'true' || needs.detect-changes.outputs.has_environments == 'true')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Infracost CLI
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost Baseline and Diff
        id: infracost-diff
        shell: bash
        continue-on-error: true
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          CONFIG_FILE="infracost.yml"
          if [ ! -f "$CONFIG_FILE" ] && [ -f ".github/infracost.yml" ]; then
            CONFIG_FILE=".github/infracost.yml"
          fi

          if [ -z "$INFRACOST_API_KEY" ]; then
            echo "[WARN] INFRACOST_API_KEY is not configured in repository secrets."
            echo "[WARN] Skipping FinOps cost diff comment. Please add INFRACOST_API_KEY secret to enable cost estimation."
            echo "skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "[WARN] Infracost configuration file '$CONFIG_FILE' not found. Skipping cost estimation."
            echo "skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "[INFO] Generating baseline cost from base branch using $CONFIG_FILE..."
          git checkout "${{ github.event.pull_request.base.ref || 'main' }}"
          if [ -f "$CONFIG_FILE" ]; then
            infracost breakdown --config-file="$CONFIG_FILE" --format=json --out-file=/tmp/infracost-base.json || true
          fi

          echo "[INFO] Generating cost diff for pull request branch..."
          git checkout "${{ github.event.pull_request.head.sha || github.sha }}"

          if [ -f /tmp/infracost-base.json ] && [ -s /tmp/infracost-base.json ]; then
            infracost diff --config-file="$CONFIG_FILE" \
              --format=json \
              --compare-to=/tmp/infracost-base.json \
              --out-file=/tmp/infracost.json || true
          else
            echo "[INFO] Baseline not available or empty; generating initial breakdown for PR branch..."
            infracost breakdown --config-file="$CONFIG_FILE" \
              --format=json \
              --out-file=/tmp/infracost.json || true
          fi

          if [ -s /tmp/infracost.json ]; then
            echo "skipped=false" >> $GITHUB_OUTPUT
          else
            echo "[WARN] Could not produce Infracost JSON diff/breakdown. Skipping comment."
            echo "skipped=true" >> $GITHUB_OUTPUT
          fi

      - name: Post Infracost Comment to Pull Request
        if: github.event_name == 'pull_request' && steps.infracost-diff.outputs.skipped != 'true'
        shell: bash
        continue-on-error: true
        run: |
          if [ -f /tmp/infracost.json ] && [ -s /tmp/infracost.json ]; then
            echo "[INFO] Publishing Infracost cost estimation comment to Pull Request..."
            infracost comment github \
              --path=/tmp/infracost.json \
              --repo=${{ github.repository }} \
              --github-token=${{ secrets.GITHUB_TOKEN }} \
              --pull-request=${{ github.event.pull_request.number }} \
              --behavior=update || true
          fi

  speculative-plan:
    name: 'Speculative Plan - ${{ matrix.environment }}'
    needs: [detect-changes, validate-environments]
    if: always() && (needs.detect-changes.outputs.has_environments == 'true' || needs.detect-changes.outputs.all_triggered == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, test, prod]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false

      - name: Resolve OIDC Role ARN for Environment
        id: resolve-role
        shell: bash
        env:
          ROLE_DEV: ${{ vars.AWS_ROLE_ARN_DEV || secrets.AWS_ROLE_ARN_DEV }}
          ROLE_TEST: ${{ vars.AWS_ROLE_ARN_TEST || secrets.AWS_ROLE_ARN_TEST }}
          ROLE_PROD: ${{ vars.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_PROD }}
        run: |
          ENV_NAME="${{ matrix.environment }}"
          case "$ENV_NAME" in
            dev)
              ROLE="${ROLE_DEV:-}"
              ;;
            test)
              ROLE="${ROLE_TEST:-}"
              ;;
            prod)
              ROLE="${ROLE_PROD:-}"
              ;;
            *)
              ROLE=""
              ;;
          esac
          echo "role_arn=${ROLE}" >> $GITHUB_OUTPUT

      - name: Authenticate to AWS via OIDC (No Static Credentials)
        id: aws-auth
        if: steps.resolve-role.outputs.role_arn != ''
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          role-to-assume: ${{ steps.resolve-role.outputs.role_arn }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Execute Terraform Speculative Plan
        id: tf-plan
        shell: bash
        run: |
          TARGET_DIR="environments/${{ matrix.environment }}"
          if [ -d "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
            if [ "${{ steps.aws-auth.outcome }}" == "success" ]; then
              echo "[INFO] Running terraform init with remote S3 backend..."
              terraform init -backend-config=backend.hcl
              echo "[INFO] Generating speculative terraform plan..."
              terraform plan -no-color -lock=false -out=tfplan
              terraform show -no-color tfplan > plan_output.txt
            else
              echo "[INFO] Initializing without backend (Static validation mode)..."
              terraform init -backend=false
              echo "Static syntax validation completed. Remote state inspection requires configured AWS OIDC credentials." > plan_output.txt
            fi
          fi

      - name: Post Plan Summary to Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let path = `environments/${{ matrix.environment }}/plan_output.txt`;
            if (!fs.existsSync(path)) {
              return;
            }
            let planText = fs.readFileSync(path, 'utf8');
            if (planText.length > 60000) {
              planText = planText.substring(0, 60000) + '\n... [Plan output truncated due to GitHub comment size limits]';
            }

            const header = `### Terraform Speculative Plan: \`${{ matrix.environment }}\``;
            const body = [
              header,
              "",
              "| Parameter | Value |",
              "| --- | --- |",
              `| Environment | \`${{ matrix.environment }}\` |`,
              `| Working Directory | \`environments/${{ matrix.environment }}\` |`,
              `| Trigger Commit | \`${context.sha.substring(0, 7)}\` |`,
              `| Auth Method | AWS OIDC (${{ steps.aws-auth.outcome || 'static-mode' }}) |`,
              "",
              "<details>",
              "<summary>View Terraform Plan Output</summary>",
              "",
              "```hcl",
              planText,
              "```",
              "",
              "</details>"
            ].join("\n");

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const botComment = comments.find(comment =>
                comment.user.type === 'Bot' && comment.body.includes(header)
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              }
            } catch (err) {
              core.warning(`[WARN] Could not post PR comment: ${err.message}`);
            }
